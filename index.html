<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificación de muestras mamarias - M-P</title>
  <style>
    body { font: 16px Arial, sans-serif; background: #f3f6fa; margin: 25px; color: #17253a; }
    main { max-width: 680px; margin: auto; background: white; padding: 26px; border-radius: 12px; box-shadow: 0 3px 18px #0001; }
    h1 { font-size: 24px; margin-top: 0; }
    .aviso { padding: 12px; background: #f5f0dc; border-radius: 8px; font-size: 14px; }
    .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 20px 0; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    select { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #aeb8c5; border-radius: 6px; font-size: 16px; }
    .ayuda { display:block; margin-top:5px; color:#516078; font-size:12px; }
    button { background: #1559a4; color: white; padding: 12px 18px; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #resultado { margin-top: 18px; padding: 13px; border-radius: 8px; display: none; }
    .error { background: #ffe5e5; color: #831a1a; }
    .exito { background: #eaf1fa; color: #183d64; }
  </style>
</head>
<body>
  <main>
    <h1>Clasificación de muestras mamarias</h1>
    <p>Neurona de McCulloch y Pitts — conjunto de datos Wisconsin (WDBC).</p>
    <p class="aviso"><strong>Ingresa</strong> valores binarios de una muestra FNA previamente analizada: <strong>1 = medida baja (menor o igual al límite)</strong> y <strong>0 = medida alta (mayor al límite)</strong>.</p>
    <form id="formulario">
      <div id="campos" class="campos"><p>Cargando características...</p></div>
      <button type="submit" id="boton" disabled>Clasificar muestra</button>
    </form>
    <div id="resultado" role="status" aria-live="polite"></div>
  </main>
  <script>
    const nombresEspanol = {
      mean: "Medio", error: "Error estándar", worst: "Mayor",
      radius: "radio", texture: "textura", perimeter: "perímetro",
      area: "área", smoothness: "suavidad", compactness: "compacidad",
      concavity: "concavidad", "concave points": "puntos cóncavos",
      symmetry: "simetría", "fractal dimension": "dimensión fractal"
    };
    const campos = document.getElementById("campos");
    const boton = document.getElementById("boton");
    const resultado = document.getElementById("resultado");
    let caracteristicas = [];

    function etiqueta(nombre) {
      const partes = nombre.match(/^(mean|worst|.* error) (.+)$/);
      if (!partes) return nombre;
      const tipo = partes[1].endsWith("error") ? "Error estándar" : nombresEspanol[partes[1]];
      const caracteristica = nombresEspanol[partes[2]] || partes[2];
      return `${caracteristica[0].toUpperCase() + caracteristica.slice(1)} (${tipo.toLowerCase()})`;
    }

    function mostrar(mensaje, error = false) {
      resultado.textContent = mensaje;
      resultado.className = error ? "error" : "exito";
      resultado.style.display = "block";
    }

    async function iniciar() {
      try {
        const respuesta = await fetch("/caracteristicas");
        if (!respuesta.ok) throw new Error("No se pudo consultar el modelo");
        const datos = await respuesta.json();
        caracteristicas = datos.caracteristicas;
        const cortes = datos.cortes;
        campos.replaceChildren();
        caracteristicas.forEach((nombre, indice) => {
          const contenedor = document.createElement("div");
          const label = document.createElement("label");
          const select = document.createElement("select");
          label.htmlFor = `campo_${indice}`;
          label.textContent = etiqueta(nombre);
          select.id = `campo_${indice}`;
          select.required = true;
          const opciones = [
            ["", "Selecciona un valor"],
            ["1", "1 — Medida baja"],
            ["0", "0 — Medida alta"]
          ];
          opciones.forEach(([valor, texto]) => {
            const opcion = document.createElement("option");
            opcion.value = valor;
            opcion.textContent = texto;
            select.append(opcion);
          });
          const ayuda = document.createElement("small");
          ayuda.textContent = `Límite de referencia: ${Number(cortes[indice]).toFixed(5)} (medida ≤ límite: 1; medida > límite: 0).`;
          ayuda.className = "ayuda";
          contenedor.append(label, select, ayuda);
          campos.append(contenedor);
        });
        boton.disabled = false;
      } catch (e) {
        campos.textContent = "No fue posible obtener las características.";
        mostrar("Comprueba que la API esté ejecutándose.", true);
      }
    }

    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      boton.disabled = true;
      const valores = {};
      caracteristicas.forEach((nombre, i) => {
        valores[nombre] = Number(document.getElementById(`campo_${i}`).value);
      });
      try {
        const respuesta = await fetch("/diagnostico", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ valores })
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(typeof datos.detail === "string" ? datos.detail : "Datos inválidos");
        mostrar(`Resultado: ${datos.clasificacion}`);
      } catch (e) {
        mostrar(`Error: ${e.message}`, true);
      } finally {
        boton.disabled = false;
      }
    });
    iniciar();
  </script>
</body>
</html>
